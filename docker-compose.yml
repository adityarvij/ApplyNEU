# Local dev stack: API + BullMQ worker + Redis.
#
#   docker compose up -d --build
#
# Dev and prod Postgres live in Supabase, so the only database here is the throwaway
# one the integration tests provision into:
#
#   docker compose --profile test up -d postgres-test

services:
  api:
    build: ./backend
    init: true
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    ports:
      - '8080:8080'
    healthcheck:
      # The image has no curl.
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    init: true
    command: ['node', '--import', 'tsx', 'src/workers/resumeEnrichmentWorker.ts']
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  agents-worker:
    build: ./backend
    init: true
    command: ['node', '--import', 'tsx', 'src/workers/agentsWorker.ts']
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Lets the worker finish the graph step it's on, which can include a model call, before
    # Docker kills it.
    stop_grace_period: 60s

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-test:
    profiles: ['test']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # Throwaway data on a tmpfs, reachable only from this machine: no password to commit.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redisdata:
